[tools]
biome = "2.5.14"
cocogitto = "7.0.0"
lefthook = "2.1.14"
bun = "1.4.2"

[hooks]
postinstall = "mise run postinstall-hook"

[env]
_.path = ["./node_modules/.bin"]
DISCORD_CLIENT_ID = "$DISCORD_CLIENT_ID_DEV"
DISCORD_CLIENT_TOKEN = "$DISCORD_TOKEN_DEV"
DEV_SERVER = "$DISCORD_DEV_SERVER"

[settings]
disable_backends = ["asdf"]
use_versions_host = false
minimum_release_age = "1d"

[task_config]
includes = ["./.config/tasks"]
